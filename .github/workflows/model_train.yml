name: Automated Model Training
on:
 push:
  branches: ["main"]
 pull_request:
  branches: ["main"]
jobs:
 train-model:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Repository Code
     uses: actions/checkout@v4
   - name: check Repository Files
     run: |
      echo "Current directory:"
      pwd
      echo "Searching for test_model.py:"
      find. -name "test_model.py"
   - name: Set up Python
     uses: actions/setup-python@v5
     with:
      python-version: '3.10'
   - name: Install Dependencies
     run: |
      python -m pip install -upgrade pip
      python -m pip install pandas numpy scilit-learn joblib pytest
   - name: Execute Model Tests
     run: python train.py
   - name: Excecute Model Tests
     run: pytest -v test_model.py
   - name: Execute Model Inference
     run: python predict.py
   - name: Upload Trained Model
     uses: actions/upload-artifact@v4
     with:
      name: trained-ml-model
      path: best_model.joblib
